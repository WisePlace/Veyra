<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #141414; --surface: #1c1c1c; --border: #2a2a2a;
      --text: #ECECEC; --muted: #9C9C9C;
      --brand: #FF6B12; --brand-hover: #FF8A33; --ink: #170a02; --err: #ff8a80;
      --grad: linear-gradient(135deg, #FF9A47, #FF6B12 55%, #E5500A);
    }
    * { box-sizing: border-box; }
    body { width: 260px; margin: 0; padding: 16px; background: var(--bg);
           color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .mark { width: 20px; height: 20px; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
    p.hint { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px;
             font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
    #send { background: var(--grad); color: #fff; }
    #send:hover { filter: brightness(1.07); }
    #copy { background: var(--surface); color: var(--text); border: 1px solid var(--border);
            margin-top: 8px; }
    #copy:hover { border-color: #3a3a3a; }
    button:disabled { opacity: 0.55; cursor: default; }
    #msg { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    #msg.ok { color: var(--brand); }
    #msg.err { color: var(--err); }
    #status { font-size: 12px; margin: 0 0 14px; color: var(--muted); line-height: 1.45; }
    #status.ok { color: var(--brand); }
  </style>
</head>
<body>
  <div class="head">
    <svg class="mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF9A47"/><stop offset=".55" stop-color="#FF6B12"/><stop offset="1" stop-color="#E5500A"/>
      </linearGradient></defs>
      <path d="M24 9.5C18.2 9.5 13.5 14.2 13.5 20c0 7.5 10.5 19.5 10.5 19.5S34.5 27.5 34.5 20C34.5 14.2 29.8 9.5 24 9.5z" fill="url(#g)"/>
      <circle cx="24" cy="19.5" r="5" fill="none" stroke="#141414" stroke-width="2.4"/>
      <circle cx="24" cy="19.5" r="1.7" fill="#141414"/>
    </svg>
    <h1>Veyra Connect</h1>
  </div>
  <div id="status">Checking…</div>
  <button id="send">Send session to Veyra</button>
  <button id="copy">Copy session cookie</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
